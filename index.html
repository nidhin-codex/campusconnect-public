<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Student Academic Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="loginPage">
        <div class="login-card">
            <div class="brand-icon">C</div>
            <h1>CampusConnect</h1>
            <p class="subtitle">Your academic journey, connected.</p>

            <form id="loginForm">
                <label for="studentId">Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter your student ID"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="primary-button">Sign In</button>
                <p id="loginMessage" class="message"></p>
            </form>

            <p class="demo-note">Student Academic Portal · Demo Version</p>
        </div>
    </div>

    <div class="app-container hidden" id="dashboardPage">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon small">C</div>
                <span>CampusConnect</span>
            </div>

            <p class="menu-heading">MAIN MENU</p>

            <nav>
                <button class="nav-item active" data-page="dashboard">▦ Dashboard</button>
                <button class="nav-item" data-page="profile">♙ My Profile</button>
                <button class="nav-item" data-page="subjects">▤ Subjects</button>
                <button class="nav-item" data-page="attendance">◷ Attendance</button>
                <button class="nav-item" data-page="results">★ Results</button>
                <button class="nav-item" data-page="timetable">▦ Timetable</button>
                <button class="nav-item" data-page="assignments">✓ Assignments</button>
                <button class="nav-item" data-page="notices">♧ Notices</button>
            </nav>

            <button id="logoutButton" class="logout-button">↪ Sign Out</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="eyebrow">STUDENT ACADEMIC PORTAL</p>
                    <h2 id="pageTitle">Dashboard</h2>
                </div>

                <div class="user-summary">
                    <div class="avatar" id="headerAvatar">S</div>
                    <div>
                        <strong id="headerName">Student</strong>
                        <p id="headerId">Student ID</p>
                    </div>
                </div>
            </header>

            <section id="pageContent"></section>

            <footer>
                CampusConnect · Student Academic Portal
            </footer>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
